name: Compute Contracts

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "packages/compute-native/**"
      - ".github/workflows/compute-contracts.yml"

jobs:
  verify-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Verify compute contracts
        run: bun run packages/compute-native/scripts/verify-compute-contracts.ts

      - name: Verify Tensix TT-Metalium pin
        run: bun run packages/compute-native/scripts/verify-tensix-pin.ts

      - name: Cargo metadata check
        run: cd packages/compute-native && cargo metadata --format-version 1 > /dev/null
