name: publish-website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build static site
        run: |
          cd packages/web
          bunx astro build --config astro.config.static.mjs
        env:
          NODE_ENV: production
          SST_STAGE: production

      - name: Copy standalone pages into dist
        run: |
          mkdir -p static/research static/enterprise
          cp -r static/* packages/web/dist/
        continue-on-error: true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/web/dist
          cname: tribunus.dev
          keep_files: true
