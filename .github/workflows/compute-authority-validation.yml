name: Compute Authority Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/compute-native/**'
      - 'packages/compute-evidence-native/**'
      - 'docs/adr/**'
      - 'schemas/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/compute-native/**'
      - 'packages/compute-evidence-native/**'
      - 'docs/adr/**'
      - 'schemas/**'

jobs:
  architecture-board:
    name: Architecture and Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate JSON Schemas
        run: |
          # Placeholder for schema validation script
          echo "Validating schemas..."
          # bun run script/validate-schemas.ts

      - name: ADR and ACR Index Audit
        run: |
          # Placeholder for ADR/ACR consistency check
          echo "Auditing ADRs and ACRs..."
          # bun run script/audit-architecture.ts

  compute-authority-macos-arm64:
    name: Compute Authority (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compute-native -> target

      - name: Check compute-core
        run: |
          cd packages/compute-native
          cargo check -p tribunus-compute-core

      - name: Run Hostile Lattice Tests
        run: |
          cd packages/compute-native
          cargo test -p tribunus-compute-core --test coverage_lattice_authority

      - name: Verify Validator CLI (Authority Mode)
        run: |
          cd packages/compute-native
          # Create a dummy valid lattice for a quick smoke test of the CLI itself
          # In a real run, this would point to a generated fixture
          cargo run -p tribunus-compute-core --bin tribunus-coreml-decode-attribution -- --help
