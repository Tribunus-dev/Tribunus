# This workflow does not prove all compute-core tests are clean.
# That is tracked by the suite hygiene ledger.
#
# This workflow proves the authority subset:
# architecture contracts compile,
# runtime work can be scoped,
# hostile lattice corruption is rejected,
# dependency linkage is valid (submodules, path deps, lockfile),
# and the result is reproducible off the developer machine.

name: Compute Authority Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/compute-native/**'
      - 'packages/compute-evidence-native/**'
      - 'docs/adr/**'
      - 'schemas/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/compute-native/**'
      - 'packages/compute-evidence-native/**'
      - 'docs/adr/**'
      - 'schemas/**'

jobs:
  architecture-board:
    name: Architecture and Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate JSON Schemas
        run: |
          # Placeholder for schema validation script
          echo "Validating schemas..."
          # bun run script/validate-schemas.ts

      - name: ADR and ACR Index Audit
        run: |
          # Placeholder for ADR/ACR consistency check
          echo "Auditing ADRs and ACRs..."
          # bun run script/audit-architecture.ts

  compute-authority-macos-arm64:
    name: Compute Authority Subset (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Submodules
        run: git submodule status --recursive

      - name: Run Compute Contract Verifier (Static)
        run: ./packages/compute-native/scripts/verify-compute-contract.sh --static

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compute-native -> target

      - name: Generate Lockfile
        working-directory: packages/compute-native
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "No Cargo.lock found, generating..."
            cargo update
            cargo check
          fi

      - name: Dependency Resolution Gate
        working-directory: packages/compute-native
        run: cargo metadata --format-version 1

      - name: Build Verification Gate
        working-directory: packages/compute-native
        run: cargo check

      - name: Run Compute Contract Verifier (Cargo)
        working-directory: packages/compute-native
        run: ../scripts/verify-compute-contract.sh --cargo

      - name: Build Authority Subset
        run: |
          cd packages/compute-native
          cargo test -p tribunus-compute-core --lib runtime_contract --no-run
          cargo test -p tribunus-compute-core --lib runtime_orchestration --no-run
          cargo test -p tribunus-compute-core --test coverage_lattice_authority --no-run
          cargo test -p tribunus-compute-core --lib storage_kernel --no-run

      - name: Run Authority Subset Tests
        run: |
          cd packages/compute-native
          cargo test -p tribunus-compute-core --lib runtime_contract -- --nocapture --test-threads=1
          cargo test -p tribunus-compute-core --lib runtime_orchestration -- --nocapture --test-threads=1
          cargo test -p tribunus-compute-core --lib storage_kernel -- --nocapture --test-threads=1
          cargo test -p tribunus-compute-core --test coverage_lattice_authority

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compute-authority-audit
          path: |
            packages/compute-native/target/debug/failure-ledger.json
            packages/compute-native/target/debug/audit.json
