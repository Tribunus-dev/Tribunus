<!doctype html>
<html lang="en" style="background-color: var(--background-base)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tribunus Cockpit</title>
    <link rel="stylesheet" href="../renderer/design-tokens.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        height: 100vh;
        gap: 16px;
        background-color: #1e1e1e;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      .panel-container {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="panel-container">
      <cockpit-session-dashboard></cockpit-session-dashboard>
    </div>
    <div class="panel-container">
      <cockpit-mission-board></cockpit-mission-board>
    </div>
    <div class="panel-container" style="grid-column: span 2;">
      <cockpit-gate-monitor></cockpit-gate-monitor>
    </div>
    <script src="./main.ts" type="module"></script>
  </body>
</html>
