[package]
name = "tribunus-compute-native"
version = "0.1.0"
edition = "2021"
description = "Tribunus Compute Kernel — native engine backend via napi-rs"
license = "AGPL-3.0-only"
autobins = false
autotests = false
autoexamples = false

[lib]
crate-type = ["cdylib"]

[workspace]
members = [
    ".",
]

[dependencies]
tribunus-compute-core = { path = "../../../prism-engine/compute-core", features = ["prism-backend"] }
napi = { version = "3.9.0", features = ["napi8", "serde-json"], default-features = false }
napi-derive = "3.5.6"
sha2 = { version = "0.10", features = ["asm"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
[build-dependencies]
napi-build = "2.3.2"

[features]
default = []

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[profile.image-build]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
incremental = false
debug = false
debug-assertions = false
overflow-checks = false
strip = "symbols"
[profile.inference-research]
inherits = "release"
opt-level = 3
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 16
incremental = true
panic = "unwind"

[profile.inference-debug]
inherits = "release"
opt-level = 3
debug = "full"
split-debuginfo = "unpacked"
strip = "none"
debug-assertions = false
overflow-checks = true
lto = "off"
codegen-units = 16
incremental = true
panic = "unwind"

[profile.inference-evidence]
inherits = "release"
opt-level = 3
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 8
incremental = false
panic = "unwind"

[profile.inference-evidence-fat]
inherits = "inference-evidence"
lto = "fat"
codegen-units = 1
incremental = false



[[test]]
name = "tensix_bridge_integration_test"
path = "tests/tensix_bridge_integration_test.rs"
